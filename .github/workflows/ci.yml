name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native gateway
        run: |
          mkdir -p /tmp/sb-gateway
          go build -mod=vendor -trimpath -buildvcs=false -o /tmp/sb-gateway/resproxyd ./cmd/resproxyd
          ln -s resproxyd /tmp/sb-gateway/xray
          echo 'RESPROXY_TEST_XRAY=/tmp/sb-gateway/xray' >> "$GITHUB_ENV"
          echo 'RESPROXY_RECOVERY_BINARY=/tmp/sb-gateway/xray' >> "$GITHUB_ENV"
      - name: Unit tests
        run: sudo -E env "PATH=$PATH" go test -p=1 -mod=vendor ./...
      - name: Gateway Xray regressions
        run: |
          mkdir -p third_party/xray-core/resources
          curl -fsSL --retry 2 --max-time 60 -o third_party/xray-core/resources/geosite.dat https://github.com/XTLS/Xray-rules-dat/releases/latest/download/geosite.dat
          curl -fsSL --retry 2 --max-time 60 -o third_party/xray-core/resources/geoip.dat https://github.com/XTLS/Xray-rules-dat/releases/latest/download/geoip-lite.dat
          geoip_hash=$(curl -fsSL --retry 2 --max-time 60 https://github.com/XTLS/Xray-rules-dat/releases/latest/download/geoip-lite.dat.sha256sum | awk '{print $1}')
          geosite_hash=$(curl -fsSL --retry 2 --max-time 60 https://github.com/XTLS/Xray-rules-dat/releases/latest/download/geosite.dat.sha256sum | awk '{print $1}')
          printf '%s  third_party/xray-core/resources/geoip.dat\n%s  third_party/xray-core/resources/geosite.dat\n' "$geoip_hash" "$geosite_hash" | sha256sum -c -
          cd third_party/xray-core
          go test ./common/errors ./common/geodata/... ./common/net ./app/router ./app/dispatcher ./app/proxyman/inbound ./app/proxyman/outbound ./transport/internet/tls ./transport/internet/reality ./transport/internet/hysteria ./transport/internet/grpc ./transport/internet/splithttp ./proxy/vless/outbound ./proxy/http ./proxy/socks ./transport/internet/finalmask/filter ./transport/internet/xdrive ./proxy/tun ./infra/conf
          go test ./testing/scenarios -run '^TestHTTPOutboundServerFirst$' -count=1
      - name: Vet
        run: go vet -mod=vendor ./...
      - name: Race checks
        run: sudo -E env "PATH=$PATH" go test -p=1 -race -mod=vendor ./internal/...
      - name: ARM64 compile
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -mod=vendor -trimpath -buildvcs=false -o /tmp/resproxyd ./cmd/resproxyd

  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check Xray upstream drift
        run: |
          pinned=$(grep -o 'core.build=[0-9a-f]\{40\}' Makefile | cut -d= -f2)
          current=$(git ls-remote https://github.com/XTLS/Xray-core.git refs/heads/main | cut -f1)
          test -n "$pinned" && test -n "$current"
          if [ "$pinned" != "$current" ]; then
            echo "::warning::Xray upstream has changed since $pinned. Review upstream fixes before the next release."
          fi

  ui-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/sbg-ui --no-save --package-lock=false playwright@1.64.1
          node /tmp/sbg-ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Monitoring snapshot regressions
        run: node tools/test-monitor.mjs
      - name: First setup and draft navigation regressions
        run: node tools/test-first-setup.mjs
      - name: Verify text rendering against stock LuCI
        env:
          PLAYWRIGHT_MODULE: /tmp/sbg-ui/node_modules/playwright
        run: |
          curl -fsSL --retry 2 --max-time 60 -o /tmp/luci.js https://raw.githubusercontent.com/openwrt/luci/128a7812f4be233c5dd7f7466f534fd888785caf/modules/luci-base/htdocs/luci-static/resources/luci.js
          echo 'a8fd2e9100249f54e64def80bf96d43a03b5af6a3f86a9f151d898994a1e1966  /tmp/luci.js' | sha256sum -c -
          node tools/test-luci-dom.mjs /tmp/luci.js
